<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Castle Fight - Two Lanes</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <div id="game-root">
        <canvas id="game" width="1280" height="720"></canvas>
        <div id="hud">
            <div class="gold">Gold: <span id="gold">0</span></div>
            <div class="controls">
                <button class="build-btn" data-type="knight">Knight Temple (100)</button>
                <button class="build-btn" data-type="archer">Archer Veil (120)</button>
                <button class="build-btn" data-type="priest">Priest Temple (150)</button>
                <button id="cancel-build">Cancel</button>
            </div>
            <div class="hints">
                Click a deploy spot to place the selected building. Two lanes. Defend your castle!
            </div>
            <div class="audio">
                <button id="music-toggle">Play Music</button>
                <label class="vol">
                    SFX
                    <input id="sfx-volume" type="range" min="0" max="1" step="0.01" value="0.5" />
                </label>
                <label class="vol">
                    Music
                    <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.3" />
                </label>
            </div>
        </div>
    </div>
    <script src="./game.js"></script>
</body>
<!--
Controls:
- Select a building button, then click a highlighted deploy slot on your side to place it.
- Goal: Destroy the enemy castle (5000 HP). Two lanes with towers.
-->
 </html>
